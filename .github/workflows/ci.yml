name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec bundler-audit check --update

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.1", gemfile: gemfiles/rails_71.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_71.gemfile }
          - { ruby: "3.2", gemfile: gemfiles/rails_80.gemfile }
          - { ruby: "3.3", gemfile: gemfiles/rails_81.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_80.gemfile }
          - { ruby: "3.4", gemfile: gemfiles/rails_81.gemfile }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rails-api-react/api
    env:
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: examples/rails-api-react/api
      - run: bin/rails db:prepare
      - run: bin/rails server -d -p 3000
      - name: Wait for the server
        run: timeout 30 bash -c 'until curl -s -o /dev/null localhost:3000/me; do sleep 1; done'
      - name: GET /me without a token is 401
        run: test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/me)" = 401
      - name: GET /auth/shakha/google redirects to Google
        run: test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/auth/shakha/google)" = 302
